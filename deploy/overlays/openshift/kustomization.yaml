apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hkh-autopilot
resources:
- ../../base
- postgres-backup.yaml
- sealed-secret-ai-access.yaml
patches:
- patch: |-
    - op: replace
      path: /spec/template/metadata/annotations/hkh.vdzonsoftware.nl~1runtime-secret-checksum
      value: "dcde1cec0f5bbff344eff4a56b84cee3758fd5f2fcb95d63743400ffefcbb4ab"
  target:
    group: apps
    kind: Deployment
    name: backend
    version: v1
- path: agent-access-patch.yaml
images:
- name: admin-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-admin
  newTag: sha-89a54e8
- name: backend-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-backend
  newTag: sha-89a54e8
- name: frontend-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-frontend
  newTag: sha-89a54e8
