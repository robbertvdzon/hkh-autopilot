apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hkh-autopilot-acceptance
resources:
- ../../base
- acceptance-secret.yaml
- sealed-secret-ai-access.yaml
- sealed-central-postgres.yaml
patches:
- patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 1Gi"
  target:
    kind: PersistentVolumeClaim
    name: database-data
    version: v1
- patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: hkh-runtime"
  target:
    group: bitnami.com
    kind: SealedSecret
    name: hkh-runtime
    version: v1alpha1
- patch: "- op: replace\n  path: /spec/template/spec/containers/0/envFrom/0/secretRef/name\n\
    \  value: hkh-runtime-acceptance"
  target:
    group: apps
    kind: Deployment
    name: backend
    version: v1
- patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: backend"
  target:
    group: route.openshift.io
    kind: Route
    name: backend
    version: v1
- patch: "- op: replace\n  path: /spec/host\n  value: hkh-autopilot-acceptance.vdzonsoftware.nl"
  target:
    group: route.openshift.io
    kind: Route
    name: frontend
    version: v1
- patch: "- op: replace\n  path: /spec/host\n  value: hkh-autopilot-admin-acceptance.vdzonsoftware.nl"
  target:
    group: route.openshift.io
    kind: Route
    name: admin
    version: v1
- patch: "- op: replace\n  path: /spec/template/metadata/annotations/hkh.vdzonsoftware.nl~1runtime-secret-checksum\n\
    \  value: \"64e99e717dc932ea178ef9cd71290d2f3adfa924ee9f1fcc3b5d89e991a871db\""
  target:
    group: apps
    kind: Deployment
    name: backend
    version: v1
- path: agent-access-patch.yaml
- path: backend-memory.yaml
- path: frontend-memory.yaml
- path: admin-memory.yaml
- path: central-postgres-patch.yaml
- path: hkh_autopilot_acc-retired-database.yaml
images:
- name: admin-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-admin
  newTag: sha-89a54e8-acceptance
- name: backend-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-backend
  newTag: sha-7e7b6aa
- name: frontend-image
  newName: ghcr.io/robbertvdzon/hkh-autopilot-frontend
  newTag: sha-74a2c36-acceptance
