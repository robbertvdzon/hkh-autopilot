# Gecommit (niet-sealed) secret met vaste, niet-productiewaarden. Zelfde aanpak als
# deploy/overlays/preview/preview-secret.yaml. Deze omgeving is standing (niet PR-gebonden), dus
# hkh.preview.pr-number blijft leeg — PreviewRuntimeConfig accepteert dat expliciet voor de
# acceptance-marker (zie backend/.../auth/PreviewRuntimeConfig.kt).
#
# Let op (bewust nog niet opgelost, zie robbertvdzon/product-factory acceptatieomgeving-plan): de
# ArchivesNL-client en de JWT/JWKS-verificatie voor record-intake zijn hier niet gemockt. Deze
# acceptatieomgeving praat dus nog met de echte opendata.archieven.nl en vereist een bereikbare JWKS
# voor dat ene endpoint. Dat is een bewust uitgestelde vervolgstap, geen blocker voor deze omgeving.
apiVersion: v1
kind: Secret
metadata:
  name: hkh-runtime
  labels:
    preview.vdzonsoftware.nl/data-class: disposable
type: Opaque
stringData:
  HKH_DATABASE_URL: jdbc:postgresql://database:5432/hkh
  HKH_DATABASE_USER: hkh_acceptance
  HKH_DATABASE_PASSWORD: hkh_acceptance_only
  HKH_CORS_ALLOWED_ORIGIN_PATTERNS: ""
  HKH_GOOGLE_CLIENT_ID: ""
  HKH_ADMIN_ALLOWED_EMAILS: ""
  HKH_PREVIEW_ENABLED: "true"
  HKH_PREVIEW_MARKER: hkh-autopilot-acceptance
