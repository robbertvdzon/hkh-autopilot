apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- sealed-secret-ai-access.yaml
secretGenerator:
- name: hkh-runtime
  literals:
  - HKH_DATABASE_URL=jdbc:postgresql://database:5432/hkh
  - HKH_DATABASE_USER=hkh_preview
  - HKH_DATABASE_PASSWORD=hkh_preview_only
  # Een PR-preview serveert de webapp en /api same-origin (de frontend-nginx proxyt /api naar
  # de backend en de webbuild krijgt een lege API_BASE_URL). Same-origin verkeer valt buiten
  # deze patronen: SameOriginRequestFilter herkent het als niet-CORS, dus een lege lijst is
  # hier veilig en laat geen enkele cross-origin client toe. agent-access-patch.yaml zet
  # dezelfde variabele daarnaast als expliciete env-waarde op de backendcontainer voor de
  # losse beheerapp; die waarde wint van deze gegenereerde secretwaarde (env gaat voor envFrom).
  - HKH_CORS_ALLOWED_ORIGIN_PATTERNS=
  - HKH_GOOGLE_CLIENT_ID=
  - HKH_ADMIN_ALLOWED_EMAILS=
  - HKH_TOPICSEARCH_PREVIEW_FIXTURES=true
  - HKH_EUROPEANA_API_KEY=preview-fixture-only
  - HKH_TOPICSEARCH_EUROPEANA_BASE_URL=http://localhost:8080/test-fixtures/europeana
  - HKH_TOPICSEARCH_WIKIDATA_BASE_URL=http://localhost:8080/test-fixtures/wikidata
  - HKH_PREVIEW_ENABLED=true
  - HKH_PREVIEW_MARKER=hkh-autopilot-pr-preview
  - HKH_PERSON_SEARCH_PAYLOAD_KEY=w++k4hdkPjjHMxZhpdW03g4aP+mZvG5WZm6Sftt+1eA=
  options:
    labels:
      preview.vdzonsoftware.nl/data-class: disposable
patches:
- target:
    version: v1
    kind: PersistentVolumeClaim
    name: database-data
  patch: "- op: replace\n  path: /spec/resources/requests/storage\n  value: 1Gi"
- target:
    group: bitnami.com
    version: v1alpha1
    kind: SealedSecret
    name: hkh-runtime
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: hkh-runtime"
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: backend
  patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: backend"
- path: agent-access-patch.yaml
