apiVersion: v1
kind: ConfigMap
metadata:
  name: hkh-open-archieven-config
data:
  # Shared, non-secret Open Archieven contract for production and acceptance.
  HKH_HISTORICAL_OPEN_ARCHIEVEN_BASE_URL: https://api.openarchieven.nl/1.1
  HKH_HISTORICAL_OPEN_ARCHIEVEN_SEARCH_PATH: /records/search.json
  HKH_HISTORICAL_OPEN_ARCHIEVEN_NAME_PARAMETER: name
  HKH_HISTORICAL_OPEN_ARCHIEVEN_EVENTPLACE_PARAMETER: eventplace
  HKH_HISTORICAL_OPEN_ARCHIEVEN_NUMBER_SHOW_PARAMETER: number_show
  HKH_HISTORICAL_OPEN_ARCHIEVEN_START_PARAMETER: start
  HKH_HISTORICAL_OPEN_ARCHIEVEN_ARCHIVE_CODE_PARAMETER: archive_code
  HKH_HISTORICAL_OPEN_ARCHIEVEN_HEEMSKERK_ARCHIVE_CODE: hee
  HKH_HISTORICAL_OPEN_ARCHIEVEN_TIMEOUT: 10s
  HKH_HISTORICAL_OPEN_ARCHIEVEN_CACHE_DURATION: 30s
  HKH_HISTORICAL_OPEN_ARCHIEVEN_RATE_LIMIT_INTERVAL: 251ms
  HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_PER_MINUTE: "60"
  HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_BURST_CAPACITY: "10"
  HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_REFILL_PER_SECOND: "1.0"
