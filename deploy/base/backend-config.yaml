apiVersion: v1
kind: ConfigMap
metadata:
  name: hkh-backend-config
data:
  # OpenShift's production pod network. Keep this range aligned with the cluster's
  # configured pod CIDR; only frontend proxy pods in this range may supply X-Forwarded-For.
  HKH_HISTORICAL_TRUSTED_PROXY_ADDRESSES: 10.128.0.0/14
