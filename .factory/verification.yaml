version: 1
commands:
  - id: deploy-runtime-secret-rollout
    pathPrefixes:
      - deploy/
      - .factory/verification.yaml
      - .github/workflows/build-images.yml
    argv: [./deploy/verify-runtime-secret-rollout.sh]
    workingDirectory: .
    timeoutSeconds: 120
  - id: backend-maven-verify
    pathPrefixes:
      - backend/
      - secrets.env.example
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv:
      - mvn
      - -B
      - --no-transfer-progress
      - clean
      - verify
    workingDirectory: backend
    timeoutSeconds: 1800
  - id: frontend-flutter-analyze
    pathPrefixes:
      - frontend/
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv: [flutter, analyze]
    workingDirectory: frontend
    timeoutSeconds: 900
  - id: frontend-flutter-test
    pathPrefixes:
      - frontend/
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv: [flutter, test]
    workingDirectory: frontend
    timeoutSeconds: 900
  - id: frontend-flutter-build-web
    pathPrefixes:
      - frontend/
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv: [flutter, build, web]
    workingDirectory: frontend
    timeoutSeconds: 1800
  - id: admin-flutter-analyze
    pathPrefixes:
      - frontend-admin/
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv: [flutter, analyze]
    workingDirectory: frontend-admin
    timeoutSeconds: 900
  - id: admin-flutter-test
    pathPrefixes:
      - frontend-admin/
      - .factory/verification.yaml
      - .github/workflows/verify.yml
    argv: [flutter, test]
    workingDirectory: frontend-admin
    timeoutSeconds: 900
