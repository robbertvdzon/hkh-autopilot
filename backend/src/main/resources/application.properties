spring.application.name=hkh-autopilot

hkh.version=${HKH_APP_VERSION:0.0.1-SNAPSHOT}
hkh.commit=${HKH_GIT_COMMIT:local}
hkh.cors-allowed-origin-patterns=${HKH_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
hkh.auth.google-client-id=${HKH_GOOGLE_CLIENT_ID:}
hkh.auth.admin-allowed-emails=${HKH_ADMIN_ALLOWED_EMAILS:}
hkh.recordintake.jwks-url=${HKH_RECORD_INTAKE_JWKS_URL:}
hkh.externalverification.archives-base-url=${HKH_EXTERNAL_VERIFICATION_ARCHIVES_BASE_URL:http://opendata.archieven.nl}
hkh.externalverification.token-key=${HKH_EXTERNAL_VERIFICATION_TOKEN_KEY:}
hkh.historical.europeana-base-url=${HKH_HISTORICAL_EUROPEANA_BASE_URL:https://api.europeana.eu}
hkh.historical.europeana-wskey=${HKH_EUROPEANA_WSKEY:}
hkh.historical.open-archieven-base-url=${HKH_HISTORICAL_OPEN_ARCHIEVEN_BASE_URL:https://api.openarchieven.nl/1.1}
hkh.historical.open-archieven-search-path=${HKH_HISTORICAL_OPEN_ARCHIEVEN_SEARCH_PATH:/records/search.json}
hkh.historical.open-archieven-name-parameter=${HKH_HISTORICAL_OPEN_ARCHIEVEN_NAME_PARAMETER:name}
hkh.historical.open-archieven-eventplace-parameter=${HKH_HISTORICAL_OPEN_ARCHIEVEN_EVENTPLACE_PARAMETER:eventplace}
hkh.historical.open-archieven-number-show-parameter=${HKH_HISTORICAL_OPEN_ARCHIEVEN_NUMBER_SHOW_PARAMETER:number_show}
hkh.historical.open-archieven-start-parameter=${HKH_HISTORICAL_OPEN_ARCHIEVEN_START_PARAMETER:start}
hkh.historical.open-archieven-archive-code-parameter=${HKH_HISTORICAL_OPEN_ARCHIEVEN_ARCHIVE_CODE_PARAMETER:archive_code}
hkh.historical.open-archieven-heemskerk-archive-code=${HKH_HISTORICAL_OPEN_ARCHIEVEN_HEEMSKERK_ARCHIVE_CODE:hee}
hkh.historical.open-archieven-timeout=${HKH_HISTORICAL_OPEN_ARCHIEVEN_TIMEOUT:10s}
hkh.historical.open-archieven-cache-duration=${HKH_HISTORICAL_OPEN_ARCHIEVEN_CACHE_DURATION:30s}
hkh.historical.open-archieven-rate-limit-interval=${HKH_HISTORICAL_OPEN_ARCHIEVEN_RATE_LIMIT_INTERVAL:251ms}
hkh.historical.open-archieven-budget-per-minute=${HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_PER_MINUTE:60}
hkh.historical.open-archieven-budget-burst-capacity=${HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_BURST_CAPACITY:10}
hkh.historical.open-archieven-budget-refill-per-second=${HKH_HISTORICAL_OPEN_ARCHIEVEN_BUDGET_REFILL_PER_SECOND:1.0}
hkh.historical.trusted-proxy-addresses=${HKH_HISTORICAL_TRUSTED_PROXY_ADDRESSES:}
hkh.preview.enabled=${HKH_PREVIEW_ENABLED:false}
hkh.preview.marker=${HKH_PREVIEW_MARKER:}
hkh.preview.pr-number=${HKH_PREVIEW_PR_NUMBER:}

spring.datasource.url=${HKH_DATABASE_URL}
spring.datasource.username=${HKH_DATABASE_USER}
spring.datasource.password=${HKH_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
